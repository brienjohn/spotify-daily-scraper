name: Scrape Spotify Charts

on:
  schedule:
    # 每天 UTC 05:00 = 台北 13:00，讓 Spotify 當天的榜單資料有足夠時間更新
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chrome
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: 還原登入狀態
        run: echo '${{ secrets.SPOTIFY_AUTH_JSON }}' > auth.json
      - run: xvfb-run -a node scrape_spotify_charts.js
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-captures
          path: debug/
          if-no-files-found: ignore
      - name: Commit and push
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Add Spotify chart snapshot $(date -u +%Y-%m-%d)"
          git push
